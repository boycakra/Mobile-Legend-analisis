{% extends "main.html"%} {% block content %}

<div
    class="flex flex-col justify-center w-screen min-h-full px-6 py-12 lg:px-8 h-screen">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
        <h2
            class="mt-10 text-2xl font-bold leading-9 tracking-tight text-center">
            Sign in to your account
        </h2>
    </div>

    <div class="mt-5 sm:mx-auto sm:w-full sm:max-w-sm">
        <form
            class="space-y-6"
            hx-post="{{ url_for('login') }}"
            hx-trigger="submit"
            hx-target="this"
            hx-swap="none">
            <div>
                <label for="email" class="block text-sm font-medium leading-6"
                    >Email address</label
                >
                <div class="mt-2">
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        class="block w-full rounded-md border-0 py-1.5 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" />
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between">
                    <label
                        for="password"
                        class="block text-sm font-medium leading-6"
                        >Password</label
                    >
                    <!-- Toggle Button -->
                    <button
                        type="button"
                        id="toggle-password"
                        class="text-indigo-600 hover:text-indigo-900 focus:outline-none">
                        <!-- Initial Icon -->
                        <!-- <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 0 .39 1.618l7.494 7.494a1.2 1.2 0 0 0 1.707.39c1.523 0 2.755-.8 3.037-2.08a1.2 1.2 0 0 0-.39-1.708l-7.494-7.494z" />
            </svg> -->
                    </button>
                </div>
                <div class="mt-2 relative">
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        class="block w-full rounded-md border-0 py-1.5 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" />
                </div>
            </div>

            <div>
                <button
                    type="submit"
                    class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    Sign in
                </button>
            </div>
            <a class="text-sm mt-2 text-blue-500" href="/register">Gak punya akun?</a>
        </form>
    </div>

</div>
{% endblock content %}
